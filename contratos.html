<div id="modulo-contratos" class="module-section active">
    <div class="cadastros-header">
        <div class="cadastros-title">Gestão de Contratos</div>
    </div>

    <div id="view-lista-contratos">
        <div class="search-bar" style="margin-bottom: 20px; display: flex; gap: 15px;">
            <input type="text" id="input-busca-cto" placeholder="Buscar contrato..." style="width: 300px;" onkeyup="filtrarContratos()">
            <button class="btn-primary" style="margin-left: auto;" onclick="abrirFormularioCto()">⊕ Novo Contrato</button>
        </div>
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nº Cto.</th>
                        <th>Cliente</th>
                        <th>Ref. Oportunidade</th>
                        <th>Valor (R$)</th>
                        <th>Status</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="tabela-contratos-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-form-cto" class="hidden">
        <div class="form-card">
            <div class="form-header">
                <span>Gerar Novo Contrato</span>
                <button class="btn-secondary" onclick="voltarParaListaCto()">← Voltar</button>
            </div>
            
            <div class="form-body active" style="background: #fdfdfd;">
                <div class="row" style="background: #e6f7ff; padding: 15px; border-radius: 4px; border: 1px solid #91d5ff; margin-bottom: 15px;">
                    <div class="form-group" style="flex: 2;">
                        <label>Orçamento Aprovado (Base do Contrato) *</label>
                        <select id="cto_orcamento_id" onchange="puxarDadosDoOrcamento()"></select>
                    </div>
                    <div class="form-group">
                        <label>Valor Fechado (R$)</label>
                        <input type="text" id="cto_valor" readonly style="background: #eee; font-weight: bold; color: #00b4b4;">
                    </div>
                </div>

                <div class="row hidden" id="area-minuta">
                    <div class="form-group full-width">
                        <label>Minuta do Contrato (Texto Base)</label>
                        <p style="font-size: 11px; color: #666; margin-top: -5px; margin-bottom: 5px;">* Pode ajustar as cláusulas diretamente nesta caixa de texto antes de gravar.</p>
                        <textarea id="cto_texto" rows="15" style="font-family: monospace; line-height: 1.5;"></textarea>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px;">
                    <button id="btn-salvar-cto" class="btn-primary" style="background: #28a745; display: none;" onclick="salvarContrato()">✓ Gerar e Víncular Contrato</button>
                </div>
            </div>
        </div>
    </div>
</div>
