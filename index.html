<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Arq - Modular</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <span>📐</span> Gestão Arq
        </div>
        <ul class="sidebar-menu">
            <li class="dropdown-btn" onclick="selecionarModuloPai('submenu-cadastros')">
                <div style="display: flex; align-items: center; gap: 12px;">👥 Módulo Cadastros</div>
                <span style="font-size: 12px; opacity: 0.7;">▼</span>
            </li>
            
            <ul id="submenu-cadastros" class="submenu">
                <li id="menu-clientes" onclick="navegarPara('clientes')">Clientes</li>
                <li id="menu-fornecedores" onclick="navegarPara('fornecedores')">Fornecedores</li>
                <li id="menu-servicos" onclick="navegarPara('servicos')">Catálogo de Serviços</li>
            </ul>

            <li class="dropdown-btn" style="margin-top: 10px;" onclick="selecionarModuloPai('submenu-comercial')">
                <div style="display: flex; align-items: center; gap: 12px;">💼 Módulo Comercial</div>
                <span style="font-size: 12px; opacity: 0.7;">▼</span>
            </li>
            
            <ul id="submenu-comercial" class="submenu">
                <li id="menu-leads" onclick="navegarPara('leads')">1. Leads (CRM)</li>
                <li id="menu-orcamentos" onclick="navegarPara('orcamentos')">2. Orçamentos</li>
                <li id="menu-contratos" onclick="navegarPara('contratos')">3. Contratos (Vendas)</li>
            </ul>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="firm-name">🏛️ Seu Escritório de Arquitetura</div>
            <div class="user-controls">
                <span style="font-weight: 500;">Arquiteto Logado</span> | ⚙️
            </div>
        </header>

        <div class="content-wrapper" id="conteudo-principal">
            </div>
    </main>

    <script src="/js/cadastros.js"></script>
    <script src="/js/comercial.js"></script>
    <script src="/js/orcamentos.js"></script>
    <script src="/js/contratos.js"></script>
    <script src="/js/app.js"></script>

</body>
</html>
