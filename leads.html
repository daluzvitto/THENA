<div id="modulo-leads" class="module-section active">
    <div class="cadastros-header">
        <div class="cadastros-title">Gestão de Leads (Oportunidades)</div>
    </div>

    <div id="view-lista-leads">
        <div class="search-bar" style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center;">
            <input type="text" id="input-busca-lead" placeholder="Buscar oportunidade..." onkeyup="filtrarLeads()" style="width: 300px;">
            
            <select id="filtro-funil" onchange="filtrarLeads()" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                <option value="Todos">Todas as Fases</option>
                <option value="1 - Contato Inicial">1 - Contato Inicial</option>
                <option value="2 - Reunião Agendada">2 - Reunião Agendada</option>
                <option value="3 - Proposta">3 - Proposta</option>
                <option value="4 - Em Negociação">4 - Em Negociação</option>
                <option value="5 - Aprovado">5 - Aprovado</option>
            </select>

            <button class="btn-primary" style="margin-left: auto;" onclick="abrirFormularioLead()">⊕ Nova Oportunidade</button>
        </div>
        
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Cliente / Contato</th>
                        <th>Oportunidade (Título)</th>
                        <th>Fase do Funil</th>
                        <th>Termômetro</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-leads-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-form-lead" class="hidden">
        <div class="form-card">
            <div class="form-header">
                <span id="titulo-form-lead">Nova Oportunidade de Venda</span>
                <button class="btn-secondary" onclick="voltarParaListaLead()">← Voltar</button>
            </div>
            
            <div class="form-body active">
                <div class="row">
                    <div class="form-group" style="flex: 0.5;">
                        <label>Data de Entrada</label>
                        <input type="date" id="lead_data_cad" required>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>Cliente Associado *</label>
                        <select id="lead_cliente_id" onchange="verificarClienteLead()">
                            <option value="novo">➕ CADASTRAR NOVO CLIENTE...</option>
                            </select>
                    </div>
                </div>

                <div class="row" id="area-novo-cliente-lead" style="background: #f9f9f9; padding: 15px; border-radius: 4px; border: 1px dashed #ccc;">
                    <div class="form-group">
                        <label>Nome do Novo Cliente *</label>
                        <input type="text" id="lead_nome" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group">
                        <label>Celular / WhatsApp *</label>
                        <input type="text" id="lead_fone" maxlength="15" oninput="mascaraTelefone(this)">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group" style="flex: 2;">
                        <label>Título da Oportunidade *</label>
                        <input type="text" id="lead_titulo" placeholder="Ex: Projeto Residencial Família Silva" required>
                    </div>
                    <div class="form-group">
                        <label>Fase Inicial</label>
                        <select id="lead_fase">
                            <option value="1 - Contato Inicial">1 - Contato Inicial</option>
                            <option value="2 - Reunião Agendada">2 - Reunião Agendada</option>
                            <option value="3 - Proposta">3 - Proposta</option>
                            <option value="4 - Em Negociação">4 - Em Negociação</option>
                            <option value="5 - Aprovado">5 - Aprovado</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-primary" onclick="salvarLead()">✓ Criar Oportunidade</button>
            </div>
        </div>
    </div>
</div>
