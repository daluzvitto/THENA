<div id="modulo-orcamentos" class="module-section active">
    <div class="cadastros-header">
        <div class="cadastros-title">Orçamentos & Propostas</div>
    </div>

    <div id="view-lista-orcamentos">
        <div class="search-bar" style="margin-bottom: 20px; display: flex; gap: 15px;">
            <input type="text" id="input-busca-orc" placeholder="Buscar proposta..." style="width: 300px;" onkeyup="filtrarOrcamentos()">
            <button class="btn-primary" style="margin-left: auto;" onclick="abrirFormularioOrc()">⊕ Nova Proposta</button>
        </div>
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Cliente</th>
                        <th>Título da Proposta</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-orcamentos-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-form-orc" class="hidden">
        <div class="form-card">
            <input type="hidden" id="orc_numero">
            <div class="form-header">
                <span id="titulo-form-orc">Nova Proposta Comercial</span>
                <button class="btn-secondary" onclick="voltarParaListaOrc()">← Voltar</button>
            </div>
            
            <div class="form-body active" style="background: #fdfdfd; border-bottom: 2px solid #eee;">
                <div class="row" style="background: #fffbe6; padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ffe58f;">
                    <div class="form-group" style="flex: 2;">
                        <label>Vincular Oportunidade (Lead) *</label>
                        <select id="orc_lead_id" onchange="puxarDadosClienteOrc()"></select>
                    </div>
                    <div class="form-group">
                        <label>Documento (CPF/CNPJ)</label>
                        <input type="text" id="info_cliente_doc" readonly style="background: #eee; font-weight: bold;" placeholder="⚠️ Não cadastrado">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group" style="flex: 2;">
                        <label>Título Personalizado da Proposta *</label>
                        <input type="text" id="orc_titulo" placeholder="Ex: Projeto Executivo de Interiores - Apto 402">
                    </div>
                    <div class="form-group">
                        <label>Emissão</label>
                        <input type="date" id="orc_data_emissao">
                    </div>
                    <div class="form-group">
                        <label>Validade</label>
                        <input type="date" id="orc_validade">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group" style="flex: 1;">
                        <label>Condições de Pagamento</label>
                        <input type="text" id="orc_cond_pagto" placeholder="Ex: 50% entrada + 3x no boleto">
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group full-width">
                        <label>Complemento / Observações da Proposta</label>
                        <textarea id="orc_complemento" rows="2" placeholder="Informações adicionais que aparecerão no orçamento..."></textarea>
                    </div>
                </div>

                <div class="form-actions" id="btn-salvar-cabecalho">
                    <button class="btn-primary" onclick="salvarCabecalhoOrc()">Salvar Cabeçalho para Liberar Itens ➔</button>
                </div>
            </div>

<div id="area-itens-orc" class="form-body active hidden" style="background: #f5f7fa; padding-top: 20px;">
                <div class="row" style="align-items: flex-end;">
                    <div class="form-group" style="flex: 1.5;">
                        <label>Serviço</label>
                        <select id="item_servico_id" onchange="puxarValorServico()"></select>
                    </div>
                    <div class="form-group" style="flex: 0.5;">
                        <label>Qtd</label>
                        <input type="number" id="item_qtd" value="1">
                    </div>
                    <div class="form-group" style="flex: 0.8;">
                        <label>V. Unitário (R$)</label>
                        <input type="text" id="item_valor" oninput="mascaraMoeda(this)" placeholder="0,00">
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>O que será executado (Máx 250 chars)</label>
                        <input type="text" id="item_obs" maxlength="250" placeholder="Detalhes técnicos deste item...">
                    </div>
                    <div class="form-group" style="flex: 0.4;">
                        <button class="btn-primary" style="width: 100%;" onclick="adicionarItemOrc()">Add</button>
                    </div>
                </div>

                <table class="data-table" style="margin-top: 15px; background: white;">
                    <thead>
                        <tr>
                            <th>Serviço</th>
                            <th>Descrição / Execução</th>
                            <th>Qtd</th>
                            <th>Unitário</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabela-itens-body"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" style="text-align: right; font-weight: bold;">TOTAL GERAL:</td>
                            <td colspan="2" style="font-weight: bold; font-size: 18px; color: #00b4b4;" id="lbl-total-orc">R$ 0,00</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="form-actions" style="margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px; display: flex; justify-content: flex-end; gap: 15px;">
                    
                    <button id="btn-imprimir-pdf" class="btn-secondary" style="background: #f39c12; color: white; border: none; padding: 10px 20px; display: none;" onclick="gerarPDF()">
                        🖨️ Gerar PDF da Proposta
                    </button>

                    <button class="btn-primary" style="background: #28a745; padding: 10px 25px; font-weight: bold;" onclick="finalizarOrcamento()">
                        ✓ Finalizar e Sair
                    </button>
                    
                </div>
            </div>
        </div>
    </div>
</div>
