<div id="modulo-servicos" class="module-section active">
    
    <div class="cadastros-header">
        <div class="cadastros-title">Catálogo de Serviços</div>
    </div>

    <div id="view-lista-servicos">
        <div class="search-bar" style="margin-bottom: 20px; display: flex; justify-content: space-between;">
            <input type="text" id="input-busca-servico" placeholder="Buscar serviço..." onkeyup="filtrarServicos()" style="width: 300px;">
            <button class="btn-primary" onclick="abrirFormularioServico()">⊕ Novo Serviço</button>
        </div>
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Serviço</th>
                        <th>Unidade</th>
                        <th>Valor Base (R$)</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-servicos-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-form-servico" class="hidden">
        <div class="form-card">
            <div class="form-header">
                <span id="titulo-form-servico">Novo Serviço</span>
                <button class="btn-secondary" onclick="voltarParaListaServico()">← Voltar para Lista</button>
            </div>
            
            <div class="form-body active">
                <div class="row">
                    <div class="form-group" style="flex: 2;">
                        <label>Nome do Serviço *</label>
                        <input type="text" id="a3_nome" placeholder="Ex: Projeto Arquitetônico de Interiores" oninput="this.value = this.value.toUpperCase()" required>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Unidade de Cobrança</label>
                        <select id="a3_unidade">
                            <option value="Projeto">Por Projeto (Preço Fechado)</option>
                            <option value="m²">Por m² (Metro Quadrado)</option>
                            <option value="Ambiente">Por Ambiente</option>
                            <option value="Hora">Por Hora Técnica</option>
                            <option value="Visita">Por Visita à Obra</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Valor Base / Tabela (R$)</label>
                        <input type="number" id="a3_valor_base" placeholder="0.00" step="0.01">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group full-width">
                        <label>Descrição do Escopo Padrão</label>
                        <textarea id="a3_descric" rows="3" placeholder="O que está incluso neste serviço?"></textarea>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-primary" onclick="salvarServico()">✓ Salvar Serviço</button>
            </div>
        </div>
    </div>
</div>
