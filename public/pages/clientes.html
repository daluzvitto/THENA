<div id="modulo-clientes" class="module-section active">
    
    <div class="cadastros-header">
        <div class="cadastros-title">Meus Clientes</div>
    </div>

    <div id="view-lista-clientes">
        <div class="search-bar" style="margin-bottom: 20px; display: flex; justify-content: space-between;">
            <input type="text" id="input-busca-cliente" placeholder="Buscar cliente por nome ou CPF..." onkeyup="filtrarClientes()" style="width: 300px;">
            <button class="btn-primary" onclick="abrirFormularioCliente()">⊕ Novo Cliente</button>
        </div>
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome / Razão Social</th>
                        <th>Documento</th>
                        <th>Contato</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-clientes-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-form-cliente" class="hidden">
        <div class="form-card">
            <div class="form-header">
                <span id="titulo-form-cliente">Novo Cadastro de Cliente</span>
                <button class="btn-secondary" onclick="voltarParaListaCliente()">← Voltar para Lista</button>
            </div>
            
            <div class="form-tabs">
                <div class="form-tab active" onclick="switchTab('cliente', 'tab-geral', this)">Identificação Básica</div>
                <div class="form-tab" onclick="switchTab('cliente', 'tab-endereco', this)">Endereço</div>
                <div class="form-tab" onclick="switchTab('cliente', 'tab-perfil', this)">Perfil & Finanças</div>
            </div>

            <div id="cliente-tab-geral" class="form-body active">
                <div class="row">
                    <div class="form-group" style="flex: 0.3;">
                        <label>Tipo (PF/PJ) *</label>
                        <select id="a1_tipo" onchange="alternarMascara('a1')">
                            <option value="PF">Pessoa Física</option>
                            <option value="PJ">Pessoa Jurídica</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="a1_lblDocumento">CPF *</label>
                        <input type="text" id="a1_cgc" maxlength="14" oninput="aplicarMascaraDoc(this, 'a1_tipo')" required>
                    </div>
                    <div class="form-group">
                        <label>Nome / Razão Social *</label>
                        <input type="text" id="a1_nome" oninput="this.value = this.value.toUpperCase()" required>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Nome Reduzido (Fantasia)</label>
                        <input type="text" id="a1_nreduz" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group">
                        <label>Celular / WhatsApp *</label>
                        <input type="text" id="a1_fone" maxlength="15" oninput="mascaraTelefone(this)" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail *</label>
                        <input type="email" id="a1_email" oninput="this.value = this.value.toLowerCase()" required>
                    </div>
                    <div class="form-group">
                        <label>Canal *</label>
                        <select id="a1_canal">
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="Ligacao">Ligação</option>
                            <option value="E-mail">E-mail</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="cliente-tab-endereco" class="form-body">
                <div class="row">
                    <div class="form-group" style="flex: 0.3;">
                        <label>CEP</label>
                        <input type="text" id="a1_cep" maxlength="9" oninput="mascaraCEP(this)">
                    </div>
                    <div class="form-group">
                        <label>Rua/Avenida</label>
                        <input type="text" id="a1_endere" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group" style="flex: 0.3;">
                        <label>Número</label>
                        <input type="text" id="a1_num" oninput="this.value = this.value.toUpperCase()">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Bairro</label>
                        <input type="text" id="a1_bairro" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group">
                        <label>Cidade</label>
                        <input type="text" id="a1_cidade" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group" style="flex: 0.3;">
                        <label>UF</label>
                        <input type="text" id="a1_uf" maxlength="2" oninput="this.value = this.value.toUpperCase()">
                    </div>
                </div>
            </div>

            <div id="cliente-tab-perfil" class="form-body">
                <div class="row">
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="a1_categ">
                            <option value="Cliente Final">Cliente Final</option>
                            <option value="Parceiro">Parceiro</option>
                            <option value="Construtora">Construtora</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Origem</label>
                        <select id="a1_origem">
                            <option value="Indicação">Indicação</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Google">Google</option>
                            <option value="Obras">Google</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Potencial</label>
                        <select id="a1_potenc">
                            <option value="A - Alto">A - Alto</option>
                            <option value="B - Médio">B - Médio</option>
                            <option value="C - Baixo">C - Baixo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Condição Pagto</label>
                        <select id="a1_conpag">
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group full-width">
                        <label>Observações Gerais</label>
                        <textarea id="a1_obs" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-primary" onclick="salvarCliente()">✓ Salvar Cliente</button>
            </div>
        </div>
    </div>
</div>
