<div id="modulo-fornecedores" class="module-section active">
    
    <div class="cadastros-header">
        <div class="cadastros-title">Meus Fornecedores</div>
    </div>

    <div id="view-lista-fornecedores">
        <div class="search-bar" style="margin-bottom: 20px; display: flex; justify-content: space-between;">
            <input type="text" id="input-busca-fornecedor" placeholder="Buscar fornecedor por nome ou CNPJ..." onkeyup="filtrarFornecedores()" style="width: 300px;">
            <button class="btn-primary" onclick="abrirFormularioFornecedor()">⊕ Novo Fornecedor</button>
        </div>
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Fornecedor / Razão Social</th>
                        <th>Documento</th>
                        <th>Contato</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-fornecedores-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-form-fornecedor" class="hidden">
        <div class="form-card">
            <div class="form-header">
                <span id="titulo-form-fornecedor">Novo Cadastro de Fornecedor</span>
                <button class="btn-secondary" onclick="voltarParaListaFornecedor()">← Voltar para Lista</button>
            </div>
            
            <div class="form-tabs">
                <div class="form-tab active" onclick="switchTab('forn', 'tab-geral', this)">Identificação Básica</div>
                <div class="form-tab" onclick="switchTab('forn', 'tab-endereco', this)">Endereço</div>
                <div class="form-tab" onclick="switchTab('forn', 'tab-financas', this)">Bancário & Categoria</div>
            </div>

            <div id="forn-tab-geral" class="form-body active">
                <div class="row">
                    <div class="form-group" style="flex: 0.3;">
                        <label>Tipo (PF/PJ) *</label>
                        <select id="a2_tipo" onchange="alternarMascara('a2')">
                            <option value="PJ">Pessoa Jurídica</option>
                            <option value="PF">Pessoa Física</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="a2_lblDocumento">CNPJ *</label>
                        <input type="text" id="a2_cgc" maxlength="18" oninput="aplicarMascaraDoc(this, 'a2_tipo')" required>
                    </div>
                    <div class="form-group">
                        <label>Razão Social / Nome Completo *</label>
                        <input type="text" id="a2_nome" oninput="this.value = this.value.toUpperCase()" required>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Nome Fantasia</label>
                        <input type="text" id="a2_nreduz" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group">
                        <label>Celular / Fixo *</label>
                        <input type="text" id="a2_fone" maxlength="15" oninput="mascaraTelefone(this)" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail Corporativo *</label>
                        <input type="email" id="a2_email" oninput="this.value = this.value.toLowerCase()" required>
                    </div>
                </div>
            </div>

            <div id="forn-tab-endereco" class="form-body">
                <div class="row">
                    <div class="form-group" style="flex: 0.3;">
                        <label>CEP</label>
                        <input type="text" id="a2_cep" maxlength="9" oninput="mascaraCEP(this)">
                    </div>
                    <div class="form-group">
                        <label>Logradouro</label>
                        <input type="text" id="a2_endere" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group" style="flex: 0.3;">
                        <label>Número</label>
                        <input type="text" id="a2_num" oninput="this.value = this.value.toUpperCase()">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Bairro</label>
                        <input type="text" id="a2_bairro" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group">
                        <label>Cidade</label>
                        <input type="text" id="a2_cidade" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group" style="flex: 0.3;">
                        <label>UF</label>
                        <input type="text" id="a2_uf" maxlength="2" oninput="this.value = this.value.toUpperCase()">
                    </div>
                </div>
            </div>

            <div id="forn-tab-financas" class="form-body">
                <div class="row">
                    <div class="form-group">
                        <label>Categoria do Fornecedor</label>
                        <select id="a2_categ">
                            <option value="Material">Material de Obra/Acabamento</option>
                            <option value="Serviço">Prestador de Serviço (Mão de Obra)</option>
                            <option value="Equipamento">Equipamentos / TI</option>
                            <option value="Outros">Outros / Administrativo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Banco</label>
                        <input type="text" id="a2_banco" placeholder="Ex: Itaú, Nubank..." oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div class="form-group">
                        <label>Agência</label>
                        <input type="text" id="a2_agencia" placeholder="0000">
                    </div>
                    <div class="form-group">
                        <label>Conta (com dígito)</label>
                        <input type="text" id="a2_conta" placeholder="00000-0">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group full-width">
                        <label>Observações / Condições de Faturamento</label>
                        <textarea id="a2_obs" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-primary" onclick="salvarFornecedor()">✓ Salvar Fornecedor</button>
            </div>
        </div>
    </div>
</div>
